name: Build Windows exe

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install and build
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean tui.spec
      - name: Write SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/tui.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/tui.exe.sha256 -Value "$hash  tui.exe" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-windows
          path: |
            dist/tui.exe
            dist/tui.exe.sha256
      - name: Attach tui.exe to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tui.exe
            dist/tui.exe.sha256
